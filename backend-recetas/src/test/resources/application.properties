# Configuración solo para pruebas: H2 en memoria,
# cargado con el mismo script de la base de datos real.
spring.datasource.url=jdbc:h2:mem:recetas;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=file:db/script_bd.sql
spring.sql.init.encoding=UTF-8

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
