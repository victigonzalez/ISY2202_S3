spring.application.name=backend-recetas

# ---------- HTTPS ----------
# La API se sirve solo por HTTPS en https://localhost:8443
# El certificado (autofirmado) se genera con keytool, ver README.
# La contraseña del keystore va en config/application.properties (fuera de Git).
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE:file:config/recetas-api.p12}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=recetas-api
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}

# ---------- Errores ----------
# Nunca exponer trazas ni mensajes internos en las respuestas
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# ---------- Oracle Autonomous Database (wallet) ----------
# Las credenciales NO van en el código. Se leen de variables de entorno
# o de config/application.properties (archivo local, fuera de Git).
#   DB_TNS_ALIAS   -> alias del tnsnames.ora, ej: foro_tp
#   DB_WALLET_PATH -> carpeta donde descomprimiste el wallet (usar / en Windows)
#   DB_USER / DB_PASSWORD
spring.datasource.url=jdbc:oracle:thin:@${DB_TNS_ALIAS:foro_tp}?TNS_ADMIN=${DB_WALLET_PATH:C:/wallets/Wallet_foro}
spring.datasource.username=${DB_USER:RECETAS_APP}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Las tablas se crean con db/script_bd.sql, Hibernate no las modifica
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
