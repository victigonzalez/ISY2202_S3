<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${receta.nombre})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container section">
    <a class="back-link" th:href="@{/buscar}">&larr; Volver a la búsqueda</a>

    <div class="detail">
        <img class="detail-img" th:src="@{/img/{f}(f=${receta.imagen})}" th:alt="${receta.nombre}">

        <div class="detail-info">
            <h1 th:text="${receta.nombre}">Receta</h1>
            <p class="lead" th:text="${receta.descripcion}">Descripción</p>

            <ul class="tags">
                <li th:text="${receta.tipoCocina}">Cocina</li>
                <li th:text="${receta.pais}">País</li>
                <li th:text="${receta.dificultad}"
                    th:classappend="${receta.dificultad == 'Fácil'} ? 'tag-facil' : (${receta.dificultad == 'Media'} ? 'tag-media' : 'tag-dificil')">Dificultad</li>
            </ul>

            <dl class="stats">
                <div><dt>Preparación</dt><dd th:text="${receta.tiempoPreparacion} + ' min'">0</dd></div>
                <div><dt>Cocción</dt><dd th:text="${receta.tiempoCoccion} + ' min'">0</dd></div>
                <div><dt>Total</dt><dd th:text="${receta.tiempoTotal()} + ' min'">0</dd></div>
                <div><dt>Porciones</dt><dd th:text="${receta.porciones}">0</dd></div>
            </dl>
        </div>
    </div>

    <div class="detail-columns">
        <section class="panel">
            <h2>Ingredientes</h2>
            <ul class="ingredients">
                <li th:each="i : ${receta.ingredientes}" th:text="${i}">Ingrediente</li>
            </ul>
        </section>

        <section class="panel">
            <h2>Preparación</h2>
            <ol class="steps">
                <li th:each="p : ${receta.pasos}" th:text="${p}">Paso</li>
            </ol>
        </section>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
