<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container section">
    <div class="login-box">
        <h1>Iniciar sesión</h1>
        <p class="muted">Ingresa para ver el detalle completo de las recetas.</p>

        <div class="alert alert-error" th:if="${param.error}">
            Usuario o contraseña incorrectos.
        </div>
        <div class="alert alert-ok" th:if="${param.logout}">
            Cerraste sesión correctamente.
        </div>

        <!-- th:action agrega automáticamente el token CSRF -->
        <form th:action="@{/login}" method="post" class="login-form">
            <div class="field">
                <label for="username">Usuario</label>
                <input id="username" name="username" type="text" required autofocus autocomplete="username">
            </div>
            <div class="field">
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" required autocomplete="current-password">
            </div>
            <button class="btn btn-block" type="submit">Entrar</button>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
