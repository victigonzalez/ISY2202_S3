spring.application.name=frontend-recetas

# El sitio queda en http://localhost:8080/recetas
server.port=8080
server.servlet.context-path=/recetas

# ---------- Cookie de sesión ----------
# HttpOnly: JavaScript no puede leerla (mitiga robo de sesión por XSS)
# SameSite=Strict: el navegador no la envía en peticiones desde otros sitios (mitiga CSRF)
# (Secure no se activa porque el entorno local es HTTP; en producción con HTTPS: secure=true)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m

# ---------- Errores ----------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

spring.thymeleaf.cache=false
